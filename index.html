<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tạo Số Ngẫu Nhiên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .ball-animate {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }
        .lottery-ball {
            background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb);
            box-shadow: 2px 4px 8px rgba(0,0,0,0.15), inset -2px -2px 6px rgba(0,0,0,0.2);
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
        }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

    <main class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="bg-indigo-600 p-3 text-center text-white">
            <h1 class="text-lg font-bold">Tạo Số Ngẫu Nhiên</h1>
        </div>

        <div class="p-3 sm:p-4">
            <!-- Numeric Inputs -->
            <div class="grid grid-cols-3 gap-2 mb-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase text-center mb-1">Min</label>
                    <input type="number" id="minVal" value="1" class="w-full p-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-center font-bold text-slate-700 bg-slate-50">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase text-center mb-1">Max</label>
                    <input type="number" id="maxVal" value="45" class="w-full p-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-center font-bold text-slate-700 bg-slate-50">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase text-center mb-1">Số lượng</label>
                    <input type="number" id="countVal" value="6" min="1" class="w-full p-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-center font-bold text-slate-700 bg-slate-50">
                </div>
            </div>

            <!-- Options Box -->
            <div class="space-y-2 p-2.5 bg-slate-50 rounded-xl border border-slate-200 mb-3">
                <!-- Option 1: 50% Even/Odd -->
                <label class="flex items-center cursor-pointer">
                    <input type="checkbox" id="evenOddRule" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                    <span class="ml-2 text-xs font-semibold text-slate-700">Cân bằng 50% chẵn / lẻ</span>
                </label>

                <!-- Option 2: Sub-range -->
                <div class="flex flex-col gap-1.5 border-t border-slate-200 pt-1.5">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="useSubRange" onchange="toggleSubRange()" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                        <span class="ml-2 text-xs font-semibold text-slate-700">Bắt buộc có số trong khoảng:</span>
                    </label>
                    <div id="subRangeInputs" class="hidden items-center gap-2 pl-6">
                        <input type="number" id="subMin" value="1" class="w-12 p-1 text-xs font-bold rounded border border-slate-300 text-center focus:ring-indigo-500 bg-white">
                        <span class="text-xs text-slate-400 font-medium">đến</span>
                        <input type="number" id="subMax" value="9" class="w-12 p-1 text-xs font-bold rounded border border-slate-300 text-center focus:ring-indigo-500 bg-white">
                    </div>
                </div>

                <!-- Option 3: Max 2 per tens -->
                <div class="border-t border-slate-200 pt-1.5">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="maxTwoPerTenRule" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                        <span class="ml-2 text-xs font-semibold text-slate-700">Không quá 2 số ở mỗi chục</span>
                    </label>
                </div>
            </div>

            <!-- Error Box -->
            <div id="errorMsg" class="hidden mb-3 p-2 rounded bg-red-50 border border-red-200 text-red-600 text-xs text-center font-semibold"></div>

            <!-- Generate Button -->
            <button onclick="generateNumbers()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 active:scale-95">
                Tạo Dãy Số
            </button>

            <!-- Results Display -->
            <div id="resultSection" class="hidden mt-4">
                <div class="flex items-center justify-between mb-2 pb-1 border-b border-slate-100">
                    <h3 class="text-xs font-bold text-slate-600">KẾT QUẢ</h3>
                    <button onclick="copyToClipboard()" id="copyBtn" class="px-2 py-1 text-[11px] font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 border border-teal-200 rounded transition flex items-center gap-1 shadow-sm">
                        Sao chép
                    </button>
                </div>
                
                <div id="ballsContainer" class="flex flex-wrap justify-center gap-2 py-2">
                    <!-- Lottery balls will appear here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleSubRange() {
            const container = document.getElementById('subRangeInputs');
            if (document.getElementById('useSubRange').checked) {
                container.classList.remove('hidden');
                container.classList.add('flex');
            } else {
                container.classList.add('hidden');
                container.classList.remove('flex');
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('errorMsg');
            errBox.textContent = msg;
            errBox.classList.remove('hidden');
            document.getElementById('resultSection').classList.add('hidden');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.add('hidden');
        }

        let currentResultStr = "";

        function generateNumbers() {
            hideError();
            
            const min = parseInt(document.getElementById('minVal').value);
            const max = parseInt(document.getElementById('maxVal').value);
            const qty = parseInt(document.getElementById('countVal').value);
            
            const useEvenOdd = document.getElementById('evenOddRule').checked;
            const useSubRange = document.getElementById('useSubRange').checked;
            const subMin = parseInt(document.getElementById('subMin').value);
            const subMax = parseInt(document.getElementById('subMax').value);
            const useMaxTwoPerTen = document.getElementById('maxTwoPerTenRule').checked;

            // Pre-flight basic validation
            if (isNaN(min) || isNaN(max) || isNaN(qty)) return showError("Vui lòng nhập số hợp lệ.");
            if (min > max) return showError("Min phải <= Max.");
            if (qty < 1) return showError("Số lượng phải >= 1.");
            if (qty > (max - min + 1)) return showError("Số lượng lớn hơn khoảng cho phép.");
            if (useSubRange && (subMin > subMax || subMin < min || subMax > max)) {
                return showError("Khoảng bắt buộc không hợp lệ so với Min/Max.");
            }

            const MAX_ATTEMPTS = 2000;
            let successResult = null;

            // Retry Loop
            for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
                let result = [];
                let tensCount = {};
                let evens = 0;
                let odds = 0;

                // Create and shuffle pool
                let pool = [];
                for (let i = min; i <= max; i++) pool.push(i);
                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }

                // Determine targets for Even/Odd
                let targetEven = 0, targetOdd = 0;
                if (useEvenOdd) {
                    targetEven = Math.floor(qty / 2);
                    targetOdd = Math.floor(qty / 2);
                    if (qty % 2 !== 0) {
                        Math.random() < 0.5 ? targetEven++ : targetOdd++;
                    }
                }

                // Rule: Mandatory sub-range
                if (useSubRange) {
                    const foundIndex = pool.findIndex(n => n >= subMin && n <= subMax);
                    if (foundIndex !== -1) {
                        const num = pool[foundIndex];
                        result.push(num);
                        const tenGrp = Math.floor(num / 10);
                        tensCount[tenGrp] = 1;
                        if (num % 2 === 0) evens++; else odds++;
                        pool.splice(foundIndex, 1);
                    } else {
                        continue; // No valid number in sub-range, retry
                    }
                }

                // Fill remaining needed numbers
                for (let i = 0; i < pool.length; i++) {
                    if (result.length === qty) break;

                    const num = pool[i];
                    const tenGrp = Math.floor(num / 10);
                    const isEven = (num % 2 === 0);

                    // Validate max 2 per tens group
                    if (useMaxTwoPerTen && (tensCount[tenGrp] || 0) >= 2) {
                        continue;
                    }

                    // Validate Even/Odd balance
                    if (useEvenOdd) {
                        if (isEven && evens >= targetEven) continue;
                        if (!isEven && odds >= targetOdd) continue;
                    }

                    // Add valid number
                    result.push(num);
                    tensCount[tenGrp] = (tensCount[tenGrp] || 0) + 1;
                    if (isEven) evens++; else odds++;
                }

                // Check if loop successfully built the full set
                if (result.length === qty) {
                    successResult = result.sort((a, b) => a - b);
                    break;
                }
            }

            if (successResult) {
                renderBalls(successResult);
            } else {
                showError("Không thể tìm được dãy số thoả mãn các điều kiện khắt khe (đã thử 2000 lần). Hãy nới lỏng điều kiện!");
            }
        }

        function renderBalls(numbers) {
            document.getElementById('resultSection').classList.remove('hidden');
            const container = document.getElementById('ballsContainer');
            container.innerHTML = '';
            
            currentResultStr = numbers.map(n => n < 10 ? '0'+n : n).join(' - ');
            
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerHTML = 'Sao chép';
            copyBtn.className = "px-2 py-1 text-[11px] font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 border border-teal-200 rounded transition flex items-center gap-1 shadow-sm";

            numbers.forEach((num, index) => {
                const strNum = num < 10 ? '0' + num : num;
                const ball = document.createElement('div');
                ball.className = "lottery-ball ball-animate w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm border border-white/40";
                ball.style.animationDelay = `${index * 0.05}s`;
                ball.textContent = strNum;
                container.appendChild(ball);
            });
        }

        function copyToClipboard() {
            if (!currentResultStr) return;
            const temp = document.createElement("textarea");
            temp.value = currentResultStr;
            document.body.appendChild(temp);
            temp.select();
            
            try {
                if(document.execCommand('copy')) {
                    const btn = document.getElementById('copyBtn');
                    btn.innerHTML = 'Đã sao chép!';
                    btn.className = "px-2 py-1 text-[11px] font-bold text-green-700 bg-green-50 border border-green-200 rounded transition shadow-sm";
                }
            } catch (err) {
                showError("Lỗi khi sao chép.");
            }
            document.body.removeChild(temp);
        }
    </script>
</body>
</html>
